<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container mt-4">
        <button class="btn btn bg-warning" data-bs-toggle="modal" data-bs-target="#Contoh">Tampilkan Modal Dialog</button>
    </div>

    <div class="modal fade" id="Contoh" aria-hidden="true" >
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title text-primary">Pesan Peringatan !</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <p class="text-danger"> selamat datang di web jaringan html dan css</p>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-danger">Simpan Data</button>
                    <button class="btn btn-primary" data-bs-dismiss="modal">Tutup</button>

                </div>

            </div>
        </div>
    </div>

</body>
</html>
