<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>from control</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
</head>
<body>

    <div class="container mt-3 bg-warning rounded-5">
        
        <h4 style  ="text-center text-primary mt-5" >FORMULIR PENDAFTARAN SISWA</h4>
    
        <div class="mb-3 form-floating">
            <input type="text" placeholder="Masukan NIPD" class="form-control">
            <label>Masukan NIPD</label>
        </div>

        <div class="mb-3 form-floating">
            <input type="text" placeholder="Nama Lengkap" class="form-control">
            <label>Nama Lengkap</label>
        </div>

        <div class="mb-3 form-floating">
            <input type="text" placeholder="Email" class="form-control">
            <label>Email</label>
        </div>

        <div  class="mb-3">
            <textarea class="form-control" placeholder="Alamat Jalan"></textarea>
        </div>

        <div class="mb-3">
            <select  class="form-select">
                <option>Rekayasa Perangkat Lunak</option>
                <option>Desain Komunikasi Visual</option>
                <option>Bisinis Digital</option>
                <option>Teknik Komputer Jaringan</option>
                <option>Akutansi</option>
            </select>
        </div>

        <div class="mb-3">
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">ekskul pramuka</label>

             <input class="form-check-input" type="checkbox">
            <label class="form-check-label">ekskul volly</label>

             <input class="form-check-input" type="checkbox">
            <label class="form-check-label">ekskul jurnalistik</label>
        </div>

        <div>
            
        </div>

        <div class="row">
            <div class="col-6"><input class="form-check-input" type="radio" name="jk">
            <label class="form-check-label">Laki Laki</label>
        </div>

            <div class="col-6"><input class="form-check-input" type="radio" name="jk">
            <label class="form-check-label">Perempuan</label>
        
        </div>
        </div>

        <button type="button" class="btn btn-danger" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Untuk Simpan Data">Simpan Data</button>
        <button type="button" class="btn btn-success">Hapus Data</button>
    
    </div>
   < const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')></const>
<const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))
</body>
</html>
</html>
